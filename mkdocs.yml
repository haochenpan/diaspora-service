site_name: Diaspora Service Documentation
site_url: https://haochenpan.github.io/diaspora-service/
site_author: Haochen Pan
site_description: Documentation for Diaspora Service
strict: true

# Report a link to a missing heading as a warning, which strict mode
# turns into an error.
validation:
  links:
    anchors: warn

repo_name: haochenpan/diaspora-service
repo_url: https://github.com/haochenpan/diaspora-service

copyright: Copyright &copy; 2023—Present Diaspora Team

theme:
  name: material
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  font:
    text: Roboto
    code: Ubuntu Mono
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  favicon: static/octopus.svg
  logo: static/octopus.svg

plugins:
  - search
  # mike deploys each version under /<version>/ and adds that to
  # site_url. Point canonical links and the sitemap at the latest alias,
  # which always holds the docs of main.
  - mike:
      canonical_version: latest

watch:
  - mkdocs.yml
  - README.md
  - docs/

extra:
  version:
    default: latest
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: haochenpan
      repo: diaspora-service
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Development:
      - Introduction: index.md
      - Architecture: architecture.md
      - Running: 1-running.md
      - Testing: 2-testing.md
      - Contributing: contributing.md
      - Deployment: 3-deploying.md
      - Monitoring: 4-monitoring.md
      - Runbook: 5-runbook.md
      - Acknowledgments: acknowledgments.md
  - Web Service:
      - Overview: web/api.md
      - Management API: web/management.md
      - Produce API: web/produce.md
      - Consume API: web/consume.md
  - Kafka Console:
      - Introduction: kafka-console/intro.md
