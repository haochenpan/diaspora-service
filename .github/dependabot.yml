version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every month
      interval: "monthly"
    groups:
      # Bump all of them in one pull request
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/web_service"
    schedule:
      # Check for updates to the base image every month
      interval: "monthly"
    ignore:
      # Stay on Python 3.14: propose its patch releases and new builds, not
      # a new minor or major version
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      # Check for updates to the locked dependencies every month
      interval: "monthly"
    groups:
      # Bump all of them in one pull request
      pip:
        patterns:
          - "*"
