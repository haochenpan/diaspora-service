version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every month
      interval: "monthly"
    groups:
      # Bump all of them in one pull request
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/web_service"
    schedule:
      # Check for updates to the base image every month
      interval: "monthly"
