name: unit-tests

# The fast test set: every test not marked integration. It is called by
# tests.yml on every push and pull request, and by deployment.yml before a
# deploy. It gets no secrets.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, ${{ matrix.python }})
    timeout-minutes: 10

    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          python: '3.14'
    runs-on: ${{ matrix.os }}

    # Placeholders that satisfy the service's start-up checks. No AWS
    # credentials or config are read, and conftest.py fails any test here
    # that opens a network connection.
    env:
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: dummy-not-real
      AWS_SECRET_ACCESS_KEY: dummy-not-real  # pragma: allowlist secret
      SERVER_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      SERVER_SECRET: dummy-not-real  # pragma: allowlist secret
      AWS_ACCOUNT_ID: '000000000000'
      AWS_ACCOUNT_REGION: us-east-1
      MSK_CLUSTER_NAME: dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Get pip cache dir
        id: pip-cache-dir
        run: echo "PIP_CACHE_DIR=$(pip cache dir)" >> "$GITHUB_ENV"

      - name: Use pip cache
        id: pip-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: tests-${{ matrix.os }}-pip-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            tests-${{ matrix.os }}-pip-${{ matrix.python }}-

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -m "not integration" -vv
