name: deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  unit:
    uses: ./.github/workflows/unit-tests.yml

  deploy-lightsail-containers:
    needs: unit
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service_name: diaspora-web-service
            container_name: docker
            dockerfile_path: web_service/Dockerfile

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS credential
        run: |
          aws sts get-caller-identity > /dev/null

      # A pinned lightsailctl release, checked against the SHA-256 in the
      # release's lightsailctl_<version>_checksums.txt before it is used.
      # The AWS CLI finds it on PATH in the push step.
      - name: Install AWS Lightsail plugin
        env:
          LIGHTSAILCTL_VERSION: 1.0.8
          LIGHTSAILCTL_SHA256: 73108f256907306ddd7fc90ff9209b8e9b256a14586c31d63222b4f58281d146  # pragma: allowlist secret
        run: |
          archive="lightsailctl_${LIGHTSAILCTL_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
              "https://github.com/aws/lightsailctl/releases/download/v${LIGHTSAILCTL_VERSION}/${archive}"
          echo "$LIGHTSAILCTL_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict

          install_dir="$RUNNER_TEMP/lightsailctl"
          mkdir -p "$install_dir"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$install_dir" lightsailctl
          "$install_dir/lightsailctl" --version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker container for AWS Lightsail
        env:
          SERVICE_NAME: ${{ matrix.service_name }}
          CONTAINER_NAME: ${{ matrix.container_name }}
          DOCKERFILE_PATH: ${{ matrix.dockerfile_path }}
        run: |
          echo "SERVICE NAME"
          echo "$SERVICE_NAME"

          echo "CONTAINER NAME"
          echo "$CONTAINER_NAME"

          echo "DOCKERFILE PATH"
          echo "$DOCKERFILE_PATH"

          docker build -t "$CONTAINER_NAME" -f "$DOCKERFILE_PATH" \
              --build-arg GIT_SHA="$GITHUB_SHA" .
          docker images

      - name: Idempotently create Lightsail container service
        env:
          SERVICE_NAME: ${{ matrix.service_name }}
        continue-on-error: true
        run: |
          aws lightsail create-container-service --region us-east-1 --service-name "$SERVICE_NAME" --power micro --scale 1

      - name: Push Docker image to Lightsail and deploy
        env:
          SERVICE_NAME: ${{ matrix.service_name }}
          CONTAINER_NAME: ${{ matrix.container_name }}
          # The name of the policy under /diaspora-service/ that the service
          # sets as the permissions boundary of each user it creates. Unset,
          # the container gets no IAM_USER_PERMISSIONS_BOUNDARY_ARN.
          BOUNDARY_NAME: ${{ vars.DOCKER_IAM_USER_PERMISSIONS_BOUNDARY_NAME }}
        run: |
          if [ -n "$BOUNDARY_NAME" ] && ! printf '%s\n' "$BOUNDARY_NAME" | grep -Eqx '[A-Za-z0-9+=,.@_-]+'; then
            echo "DOCKER_IAM_USER_PERMISSIONS_BOUNDARY_NAME is not an IAM policy name" >&2
            exit 1
          fi

          output=$(aws lightsail push-container-image --region us-east-1 --service-name "$SERVICE_NAME" --label "$CONTAINER_NAME" --image "$CONTAINER_NAME")
          image_name=$(echo "$output" | sed -n 's/.*Refer to this image as "\(.*\)" in deployments.*/\1/p')

          echo "IMAGE NAME"
          echo "$image_name"

          containers=$(jq -n --arg image_name "$image_name" \
              --arg aws_account_id "${{ secrets.DOCKER_AWS_ACCOUNT_ID }}" \
              --arg aws_accound_region "${{ secrets.DOCKER_AWS_ACCOUNT_REGION }}" \
              --arg msk_cluster_name "${{ secrets.DOCKER_MSK_CLUSTER_NAME }}" \
              --arg msk_cluster_arn_suffix "${{ secrets.DOCKER_MSK_CLUSTER_ARN_SUFFIX }}" \
              --arg aws_access_key_id "${{ secrets.DOCKER_AWS_ACCESS_KEY_ID }}" \
              --arg aws_secret_access_key "${{ secrets.DOCKER_AWS_SECRET_ACCESS_KEY }}" \
              --arg client_id "${{ secrets.DOCKER_CLIENT_ID }}" \
              --arg client_secret "${{ secrets.DOCKER_CLIENT_SECRET }}" \
              --arg client_scope "${{ secrets.DOCKER_CLIENT_SCOPE }}" \
              --arg default_servers "${{ secrets.DOCKER_DEFAULT_SERVERS }}" \
              --arg server_client_id "${{ secrets.DOCKER_SERVER_CLIENT_ID }}" \
              --arg server_secret "${{ secrets.DOCKER_SERVER_SECRET }}" \
              --arg boundary_name "$BOUNDARY_NAME" '{
              "flask": {
                  "image": $image_name,
                  "ports": {
                      "8000": "HTTP"
                  },
                  "environment": ({
                      "AWS_ACCOUNT_ID": $aws_account_id,
                      "AWS_ACCOUNT_REGION": $aws_accound_region,
                      "MSK_CLUSTER_NAME": $msk_cluster_name,
                      "MSK_CLUSTER_ARN_SUFFIX": $msk_cluster_arn_suffix,
                      "AWS_ACCESS_KEY_ID": $aws_access_key_id,
                      "AWS_SECRET_ACCESS_KEY": $aws_secret_access_key,
                      "CLIENT_ID": $client_id,
                      "CLIENT_SECRET": $client_secret,
                      "CLIENT_SCOPE": $client_scope,
                      "DEFAULT_SERVERS": $default_servers,
                      "SERVER_CLIENT_ID": $server_client_id,
                      "SERVER_SECRET": $server_secret
                  } + (if $boundary_name == "" then {} else {
                      "IAM_USER_PERMISSIONS_BOUNDARY_ARN": ("arn:aws:iam::" + $aws_account_id + ":policy/diaspora-service/" + $boundary_name)
                  } end))
              }
          }')


          public_endpoint=$(jq -n '{
              "containerName": "flask",
              "containerPort": 8000
          }')

          aws lightsail create-container-service-deployment --region us-east-1 \
              --service-name "$SERVICE_NAME" \
              --containers "$containers" \
              --public-endpoint "$public_endpoint" > /dev/null

      - name: Wait for the deployment to become active
        env:
          SERVICE_NAME: ${{ matrix.service_name }}
        timeout-minutes: 25
        run: |
          version=$(aws lightsail get-container-services --region us-east-1 \
              --service-name "$SERVICE_NAME" \
              --query 'containerServices[0].nextDeployment.version' --output text)
          if [ -z "$version" ] || [ "$version" = "None" ]; then
            echo "::error::No pending deployment found for $SERVICE_NAME"
            exit 1
          fi
          echo "Waiting for deployment version $version"

          deadline=$((SECONDS + 20 * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            states=$(aws lightsail get-container-services --region us-east-1 \
                --service-name "$SERVICE_NAME" \
                --query 'containerServices[0].[currentDeployment.version, currentDeployment.state, nextDeployment.version, nextDeployment.state]' \
                --output text)
            read -r current_version current_state next_version next_state <<< "$states"
            echo "current: $current_version $current_state, next: $next_version $next_state"

            if [ "$current_version" = "$version" ] && [ "$current_state" = "ACTIVE" ]; then
              echo "Deployment $version is active"
              exit 0
            fi
            if [ "$next_version" = "$version" ] && [ "$next_state" = "FAILED" ]; then
              echo "::error::Deployment $version failed; check the container logs"
              exit 1
            fi
            if [ "$current_version" != "$version" ] && [ "$next_version" != "$version" ]; then
              echo "::error::Deployment $version is no longer pending and did not become active"
              exit 1
            fi
            sleep 30
          done

          echo "::error::Deployment $version is not active after 20 minutes"
          exit 1

      - name: Delete container images no longer needed
        env:
          SERVICE_NAME: ${{ matrix.service_name }}
        continue-on-error: true
        run: |
          # Keep the images of the active deployment, of any deployment still
          # activating, and of the most recent inactive deployment (the
          # rollback target); delete the rest.
          if ! deployments=$(aws lightsail get-container-service-deployments --region us-east-1 \
              --service-name "$SERVICE_NAME" \
              --query 'deployments[].{version: version, state: state, images: containers.*.image}' \
              --output json); then
            echo "::warning::Could not list deployments of $SERVICE_NAME; no images deleted"
            exit 0
          fi

          if [ "$(jq '[.[] | select(.state == "ACTIVE")] | length' <<< "$deployments")" -eq 0 ]; then
            echo "::warning::No active deployment of $SERVICE_NAME found; no images deleted"
            exit 0
          fi

          if jq -e '[.[] | select(.state == "ACTIVE" or .state == "ACTIVATING")
                  | (.images // []) | length] | any(. == 0)' <<< "$deployments" > /dev/null; then
            echo "::warning::A deployment of $SERVICE_NAME in use names no image; no images deleted"
            exit 0
          fi

          keep=$(jq -c '
              sort_by(.version) | reverse
              | ([.[] | select(.state == "ACTIVE" or .state == "ACTIVATING") | .images[]]
                 + ([.[] | select(.state == "INACTIVE" and ((.images // []) | length) > 0)]
                    | .[:1] | map(.images[])))
              | unique' <<< "$deployments")

          if ! images=$(aws lightsail get-container-images --region us-east-1 \
              --service-name "$SERVICE_NAME" \
              --query 'containerImages[].image' --output json); then
            echo "::warning::Could not list container images of $SERVICE_NAME; no images deleted"
            exit 0
          fi

          echo "Keeping: $(jq -r 'join(", ")' <<< "$keep")"

          jq -r --argjson keep "$keep" '.[] | select(IN($keep[]) | not)' <<< "$images" |
          while read -r image; do
            echo "Deleting $image"
            if ! aws lightsail delete-container-image --region us-east-1 \
                --service-name "$SERVICE_NAME" --image "$image"; then
              echo "::warning::Could not delete container image $image"
            fi
          done
