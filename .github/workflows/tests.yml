name: tests

on:
  push:
    branches: [main, test-me-*]
    tags: '**'
  pull_request:
  schedule:
    # Nightly live tests, followed by the sweep of what they left behind.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    uses: ./.github/workflows/unit-tests.yml

  # The integration set runs against the live AWS account and MSK cluster,
  # so it runs only on main, nightly and by hand, one run at a time.
  live:
    name: live (${{ matrix.os }}, ${{ matrix.python }})
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 20
    concurrency:
      group: live-tests
      cancel-in-progress: false

    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          python: '3.14'
    runs-on: ${{ matrix.os }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DOCKER_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DOCKER_AWS_SECRET_ACCESS_KEY }}
      CLIENT_ID: ${{ secrets.DOCKER_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.DOCKER_CLIENT_SECRET }}
      CLIENT_SCOPE: ${{ secrets.DOCKER_CLIENT_SCOPE }}
      DEFAULT_SERVERS: ${{ secrets.DOCKER_DEFAULT_SERVERS }}
      SERVER_CLIENT_ID: ${{ secrets.DOCKER_SERVER_CLIENT_ID }}
      SERVER_SECRET: ${{ secrets.DOCKER_SERVER_SECRET }}
      AWS_ACCOUNT_ID: ${{ secrets.DOCKER_AWS_ACCOUNT_ID }}
      AWS_ACCOUNT_REGION: ${{ secrets.DOCKER_AWS_ACCOUNT_REGION }}
      MSK_CLUSTER_NAME: ${{ secrets.DOCKER_MSK_CLUSTER_NAME }}
      MSK_CLUSTER_ARN_SUFFIX: ${{ secrets.DOCKER_MSK_CLUSTER_ARN_SUFFIX }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Get pip cache dir
        id: pip-cache-dir
        run: echo "PIP_CACHE_DIR=$(pip cache dir)" >> "$GITHUB_ENV"

      - name: Use pip cache
        id: pip-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: tests-${{ matrix.os }}-pip-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            tests-${{ matrix.os }}-pip-${{ matrix.python }}-

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"

      # Runs without the repository's secrets (forks') can't reach the
      # live cluster, so they stop after the install.
      - name: Run live tests
        if: env.CLIENT_ID != ''
        run: pytest tests/ -m integration -vv -s

      - name: Skip live tests
        if: env.CLIENT_ID == ''
        run: echo "::notice::No secrets in this run, so the live tests were skipped."

      - name: Delete leftover test resources
        if: always() && github.event_name == 'schedule' && env.CLIENT_ID != ''
        run: python scripts/sweep_test_resources.py --apply
