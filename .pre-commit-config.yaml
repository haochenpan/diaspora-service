ci:
  autofix_prs: false
  autoupdate_schedule: monthly
repos:
  - repo: 'https://github.com/pre-commit/pre-commit-hooks'
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-docstring-first
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: name-tests-test
  - repo: 'https://github.com/codespell-project/codespell'
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: 'https://github.com/charliermarsh/ruff-pre-commit'
    rev: v0.16.10
    hooks:
      - id: ruff
        args:
          - '--fix'
      - id: ruff-format
  - repo: 'https://github.com/pre-commit/mirrors-mypy'
    rev: v2.4.0
    hooks:
      - id: mypy
        # Without the hook's default --ignore-missing-imports, so an import
        # mypy can't resolve fails the hook; pyproject.toml lists the modules
        # that publish no types.
        args: ['--scripts-are-modules']
        additional_dependencies:
          - 'boto3-stubs[dynamodb,iam]'
          - fastapi
          - globus-sdk
          - httpx
          - pydantic
          - pytest
          - uvicorn
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        # actionlint runs shellcheck on each run: step when it is on PATH;
        # shellcheck-py puts it there, here and on pre-commit.ci.
        additional_dependencies: ['shellcheck-py==0.11.0.1']
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
